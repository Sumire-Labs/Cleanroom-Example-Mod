name: Publish to CurseForge and/or Modrinth

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built runtime jar to configured platforms
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - name: Require a release tag
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Select a version tag in 'Use workflow from' when publishing." >&2
            exit 1
          fi
      - name: Validate repository variables and secrets
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          if [[ -z "$MODRINTH_ID" && -z "$CURSEFORGE_ID" ]]; then
            echo "Set MODRINTH_ID and/or CURSEFORGE_ID in repository Actions variables." >&2
            exit 1
          fi
          if [[ -n "$MODRINTH_ID" && -z "$MODRINTH_TOKEN" ]]; then
            echo "MODRINTH_ID is set but the MODRINTH_TOKEN secret is missing." >&2
            exit 1
          fi
          if [[ -n "$CURSEFORGE_ID" && -z "$CURSEFORGE_TOKEN" ]]; then
            echo "CURSEFORGE_ID is set but the CURSEFORGE_TOKEN secret is missing." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
        name: Set up Gradle
      - name: Read release version and type
        id: version
        run: |
          echo "value=$(./gradlew -q --console=plain printVersion)" >> "$GITHUB_OUTPUT"
          echo "type=$(./gradlew -q --console=plain printReleaseType)" >> "$GITHUB_OUTPUT"
      - name: Build runtime jar
        run: ./gradlew build -Penable_mixin=true
      - name: Select runtime jar
        id: runtime
        shell: bash
        run: |
          shopt -s nullglob
          jars=(build/libs/*.jar)
          runtime=()
          for artifact in "${jars[@]}"; do
            case "$artifact" in
              *-mcp.jar|*-sources.jar|*-javadoc.jar) ;;
              *) runtime+=("$artifact") ;;
            esac
          done
          if (( ${#runtime[@]} != 1 )); then
            echo "Expected exactly one runtime jar, found ${#runtime[@]}" >&2
            printf '%s\n' "${runtime[@]}" >&2
            exit 1
          fi
          echo "file=${runtime[0]}" >> "$GITHUB_OUTPUT"
      - name: Get changes between tags
        id: changes
        uses: simbo/changes-between-tags-action@v1
      - uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.runtime.outputs.file }}
          loaders: forge
          game-versions: 1.12.2
          java: '25'
          version: ${{ steps.version.outputs.value }}
          version-type: ${{ steps.version.outputs.type }}
          changelog: ${{ steps.changes.outputs.changes }}
