name: Build mod jar

on:
  [workflow_dispatch, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        enable_mixin: [true, false]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build -Penable_mixin=${{ matrix.enable_mixin }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-mixin-${{ matrix.enable_mixin }}
          path: build/libs/*.jar
          if-no-files-found: error
