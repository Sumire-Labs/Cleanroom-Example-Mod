// Mixin AP supplies refmaps and member mappings; CleanroomGradle reobfuscates.
if (mixinEnabled) {
    def refmapDirectory = layout.buildDirectory.dir('generated/mixin')
    def refmapFile = refmapDirectory.map { it.file("${mod_id}.refmap.json") }
    def extraMappings = layout.buildDirectory.file('generated/mixin-mappings/mixin.srg')
    def srgMapping = layout.buildDirectory.file('generated/mixin-mappings/mcp-to-srg.srg')
    def mergedMappings = layout.buildDirectory.file('generated/mixin-mappings/merged.srg')
    def extractedMapping = tasks.named('extractUserdevMcpToSrg')
    def convertMappings = tasks.register('prepareMixinMappings') {
        group = 'build setup'
        description = 'Converts Cleanroom mappings to the SRG format accepted by Mixin AP.'
        dependsOn extractedMapping
        inputs.file(extractedMapping.flatMap { it.output })
        outputs.file(srgMapping)
        doLast {
            def output = srgMapping.get().asFile
            output.parentFile.mkdirs()
            net.minecraftforge.srgutils.IMappingFile.load(inputs.files.singleFile)
                    .write(output.toPath(), net.minecraftforge.srgutils.IMappingFile.Format.SRG, false)
        }
    }
    compileJava {
        dependsOn convertMappings
        inputs.file(srgMapping)
        outputs.file(refmapFile)
        outputs.file(extraMappings)
        options.compilerArgs += [
                '-AdefaultObfuscationEnv=searge',
                "-AreobfSrgFile=${srgMapping.get().asFile}",
                "-AoutSrgFile=${extraMappings.get().asFile}",
                "-AoutRefMapFile=${refmapFile.get().asFile}"
        ]
        doFirst {
            refmapDirectory.get().asFile.mkdirs()
            extraMappings.get().asFile.parentFile.mkdirs()
        }
    }
    sourceSets.main.resources.srcDir(refmapDirectory)
    processResources.dependsOn compileJava
    tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn compileJava }

    def mergeMappings = tasks.register('mergeMixinMappings') {
        group = 'build setup'
        description = 'Merges Minecraft and Mixin member mappings for the single-file renamer input.'
        dependsOn compileJava
        inputs.file(srgMapping)
        inputs.file(extraMappings)
        outputs.file(mergedMappings)
        doLast {
            def base = net.minecraftforge.srgutils.IMappingFile.load(srgMapping.get().asFile)
            def extra = net.minecraftforge.srgutils.IMappingFile.load(extraMappings.get().asFile)
            base.merge(extra).write(mergedMappings.get().asFile.toPath(),
                    net.minecraftforge.srgutils.IMappingFile.Format.SRG, false)
        }
    }
    reobfJar {
        dependsOn mergeMappings
        map.setFrom(mergedMappings)
    }
}
