# Gradle itself needs Java 25. Foojay provisions compilation/run toolchains.
org.gradle.jvmargs = -Xmx2G
org.gradle.caching = true

# Version is derived from Git tags. Tag 0.1.0 to release 0.1.0.
versioning.releaseBranch = main
# Optional upload stage: versioning.stage = alpha / beta / rc / release
# Default: beta below 1.0.0, release from 1.0.0 onwards.

# Also rename Java packages/directories when changing root_package.
root_package = com.sumirelabs
mod_id = cleanroom-example-mod
mod_name = Cleanroom Example Mod
mod_description =
mod_url =
mod_update_json =
# Comma-separated authors
mod_authors =
mod_credits =
mod_logo_path =
mod_issue_tracker =

# Published userdev coordinates use 0.7.0, even though the loader release tag is 0.7.0-alpha.
cleanroom_version = 0.7.0
cleanmix_version = 0.7.3
mixinextras_version = 0.5.5

enable_mixin = true
# CleanroomGradle generates this refmap. Give it a unique name when renaming the Mod.
cg.userdev.refmap = cleanroom-example-mod.refmap.json
generate_sources_jar = true
generate_javadocs_jar = false
enable_junit_testing = true
show_testing_output = false
enable_shadow = false

# Optional AT: src/main/resources/META-INF/<mod_id>_at.cfg
use_access_transformer = false

# Optional coremod, independent of Mixin
is_coremod = false
coremod_includes_mod = true
coremod_plugin_class_name = com.sumirelabs.core.LoadingPlugin

use_asset_mover = false
asset_mover_version = 2.5

# JVM arguments are whitespace-delimited; quoted spaces are not supported.
minecraft_username = Developer
extra_jvm_args =
enable_foundation_debug = false
enable_mixin_debug = false

# Opt-in publication. Credentials: SumireMavenUsername / SumireMavenPassword
# or environment variables ORG_GRADLE_PROJECT_SumireMavenUsername/Password.
publish_to_maven = false
publish_to_local_maven = false
maven_name = SumireMaven
maven_url =
